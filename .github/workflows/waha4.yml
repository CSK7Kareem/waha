          package com.waha.app

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.view.accessibility.AccessibilityEvent
          import org.json.JSONObject
          import java.util.Calendar

          class GuardService : AccessibilityService() {
              private val allow = setOf(
                  "com.waha.app", "com.android.systemui", "com.android.phone",
                  "com.android.incallui", "com.samsung.android.incallui",
                  "com.samsung.android.dialer", "com.google.android.dialer",
                  "com.android.emergency", "com.samsung.android.app.telephonyui"
              )
              private var last = 0L

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  val p = e?.packageName?.toString() ?: return
                  if (p in allow || p.contains("keyboard") || p.contains("inputmethod") || p.contains("honeyboard") || p.contains("permissioncontroller") || p.contains("packageinstaller")) return
                  if (!due(this)) return
                  val n = System.currentTimeMillis()
                  if (n - last < 800) return
                  last = n
                  startActivity(
                      Intent(this, MainActivity::class.java)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                  )
              }

              override fun onInterrupt() {}
          }

          fun due(c: Context): Boolean {
              try {
                  val s = c.getSharedPreferences("w", 0).getString("state", null) ?: return false
                  val j = JSONObject(s)
                  if (!j.optBoolean("lock", true)) return false
                  if (j.optLong("pass", 0) > System.currentTimeMillis()) return false
                  val cal = Calendar.getInstance()
                  val h = cal.get(Calendar.HOUR_OF_DAY)
                  val sim = j.optString("sim", "auto")
                  val w = j.optJSONObject("w")
                  val ms = w?.optInt("ms", 4) ?: 4
                  val me = w?.optInt("me", 12) ?: 12
                  val ns = w?.optInt("ns", 19) ?: 19
                  val ph = if (sim != "auto") sim else if (h >= ms && h < me) "morning" else if (h >= ns || h < ms) "night" else "day"
                  if (h < ms) cal.add(Calendar.DAY_OF_MONTH, -1)
                  val key = "${cal.get(Calendar.YEAR)}-${cal.get(Calendar.MONTH) + 1}-${cal.get(Calendar.DAY_OF_MONTH)}"
                  val wd = cal.get(Calendar.DAY_OF_WEEK) - 1
                  val done = j.optJSONObject("log")?.optJSONObject(key)
                  val rs = j.getJSONArray("routines")
                  for (i in 0 until rs.length()) {
                      val r = rs.getJSONObject(i)
                      if (r.getString("when") != ph || !r.optBoolean("lock", true)) continue
                      val d = r.getJSONArray("days")
                      var ok = false
                      for (k in 0 until d.length()) if (d.getInt(k) == wd) ok = true
                      if (ok && done?.has(r.getString("id")) != true) return true
                  }
              } catch (e: Exception) {
              }
              return false
          }
