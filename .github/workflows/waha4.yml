          package com.waha.app

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.Manifest
          import android.content.pm.PackageManager
          import android.location.LocationManager
          import android.provider.Settings
          import android.webkit.JavascriptInterface
          import android.webkit.WebView

          class MainActivity : Activity() {
              private lateinit var w: WebView

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  w = WebView(this)
                  setContentView(w)
                  w.settings.javaScriptEnabled = true
                  w.settings.domStorageEnabled = true
                  w.addJavascriptInterface(Bridge(), "Android")
                  w.loadUrl("file:///android_asset/index.html")
                  val sp = getSharedPreferences("w", 0)
                  if (!sp.getBoolean("asked", false)) {
                      sp.edit().putBoolean("asked", true).apply()
                      val ps = mutableListOf(Manifest.permission.ACCESS_COARSE_LOCATION)
                      if (Build.VERSION.SDK_INT >= 33) ps.add("android.permission.POST_NOTIFICATIONS")
                      requestPermissions(ps.toTypedArray(), 3)
                  }
              }

              override fun onRequestPermissionsResult(code: Int, p: Array<out String>, r: IntArray) {
                  super.onRequestPermissionsResult(code, p, r)
                  w.evaluateJavascript("typeof getLoc==='function'&&getLoc()", null)
              }

              override fun onResume() {
                  super.onResume()
                  w.evaluateJavascript("typeof render==='function'&&render()", null)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (due(this)) return
                  super.onBackPressed()
              }

              inner class Bridge {
                  @JavascriptInterface
                  fun sync(s: String) {
                      getSharedPreferences("w", 0).edit().putString("state", s).apply()
                  }

                  @JavascriptInterface
                  fun load(): String = getSharedPreferences("w", 0).getString("state", "") ?: ""

                  @JavascriptInterface
                  fun openAccess() {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  }

                  @JavascriptInterface
                  fun openAppInfo() {
                      startActivity(
                          Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + packageName))
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      )
                  }

                  @JavascriptInterface
                  fun askNotif() {
                      if (Build.VERSION.SDK_INT >= 33) {
                          runOnUiThread { requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1) }
                      }
                  }

                  @JavascriptInterface
                  fun share(t: String) {
                      startActivity(
                          Intent.createChooser(Intent(Intent.ACTION_SEND).setType("text/plain").putExtra(Intent.EXTRA_TEXT, t), "Ø´Ø§Ø±Ùƒ")
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      )
                  }

                  @JavascriptInterface
                  fun locate() {
                      runOnUiThread {
                          if (checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                              requestPermissions(arrayOf(Manifest.permission.ACCESS_COARSE_LOCATION), 2)
                              return@runOnUiThread
                          }
                          try {
                              val lm = getSystemService(LOCATION_SERVICE) as LocationManager
                              val l = listOf("network", "passive", "gps").mapNotNull {
                                  try { lm.getLastKnownLocation(it) } catch (e: Exception) { null }
                              }.maxByOrNull { it.time }
                              if (l != null) w.evaluateJavascript("onLoc(${l.latitude},${l.longitude})", null)
                          } catch (e: Exception) {
                          }
                      }
                  }

                  @JavascriptInterface
                  fun schedule(m: String, n: String) {
                      getSharedPreferences("w", 0).edit().putString("tm", m).putString("tn", n).apply()
                      planAlarms(this@MainActivity)
                  }
              }
          }
