          package com.waha.app

          import android.app.AlarmManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import java.util.Calendar

          class Reminder : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  val morning = i.getStringExtra("k") != "n"
                  val nm = c.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel("w", "ØªØ°ÙƒÙŠØ± Ø§Ù„Ø±ÙˆØªÙŠÙ†", NotificationManager.IMPORTANCE_HIGH))
                  val pi = PendingIntent.getActivity(
                      c, 0, Intent(c, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val n = Notification.Builder(c, "w")
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle(if (morning) "ØµØ¨Ø§Ø­ Ø§Ù„Ø®ÙŠØ±" else "Ø­Ø§Ù† ÙˆÙ‚Øª Ø§Ù„Ù†ÙˆÙ…")
                      .setContentText("Ø£Ù†Ø¬Ø² Ø±ÙˆØªÙŠÙ†Ùƒ Ù„ØªÙÙØªØ­ Ù„Ùƒ Ø§Ù„Ø£Ø¨ÙˆØ§Ø¨")
                      .setContentIntent(pi)
                      .setAutoCancel(true)
                      .build()
                  nm.notify(if (morning) 1 else 2, n)
                  planAlarms(c)
              }
          }

          class Boot : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  planAlarms(c)
              }
          }

          fun planAlarms(c: Context) {
              try {
                  val p = c.getSharedPreferences("w", 0)
                  val am = c.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val items = listOf("m" to (p.getString("tm", "06:30") ?: "06:30"), "n" to (p.getString("tn", "21:30") ?: "21:30"))
                  for ((idx, it) in items.withIndex()) {
                      val hm = it.second.split(":")
                      val cal = Calendar.getInstance()
                      cal.set(Calendar.HOUR_OF_DAY, hm[0].toInt())
                      cal.set(Calendar.MINUTE, hm[1].toInt())
                      cal.set(Calendar.SECOND, 0)
                      if (cal.timeInMillis <= System.currentTimeMillis()) cal.add(Calendar.DAY_OF_MONTH, 1)
                      val pi = PendingIntent.getBroadcast(
                          c, idx, Intent(c, Reminder::class.java).putExtra("k", it.first),
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                      am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                  }
              } catch (e: Exception) {
              }
          }
